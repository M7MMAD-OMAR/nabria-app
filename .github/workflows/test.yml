name: test

# Deliberately cheap. Every push runs the fast checks and the distribution
# matrix; nothing here compiles whisper.cpp, which is a five-minute job that
# only needs doing when engine/VERSION changes -- that lives in engine.yml
# behind a tag.
#
# All of it can be run locally with `scripts/check.sh`, which is the point:
# a green tick here should confirm what you already know, not be the only
# place the truth exists.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Lint, syntax and the full test suite, on a machine that is not the
    # development one: no discrete GPU, no Hyprland, no PipeWire.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the desktop stack
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
                                  shellcheck xvfb
          pip install pytest

      - name: scripts/check.sh --quick
        # Under a virtual display, so the window tests run rather than skip
        # themselves. A job whose only outcome is "skipped" proves nothing
        # while reporting success.
        run: xvfb-run -a ./scripts/check.sh --quick

  distros:
    # Runs scripts/check.sh, not a copy of it. The images and their package
    # lists used to be restated here, with a comment asking the next person to
    # keep the two in step by hand -- while the docs claimed CI and the script
    # could not drift. One of those had to give.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check.sh --distros
        run: ./scripts/check.sh --distros
